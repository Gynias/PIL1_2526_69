<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue sur MentorLink</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid rgba(255, 255, 255, 0.18); text-align: center; max-width: 500px; }
        h1 { margin-top: 0; font-size: 2.5em; }
        p { font-size: 1.2em; line-height: 1.6; }
        .btn { display: inline-block; padding: 15px 30px; margin-top: 20px; background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>🎉 Bienvenue !</h1>
        <p>Félicitations, ton compte étudiant est créé avec succès.</p>
        <p>Tu es maintenant prêt(e) à demander de l'aide à tes camarades ou à proposer tes talents de mentor pour gagner tes premiers badges !</p>
        <a href="/dashboard/" class="btn">Aller au Tableau de Bord 🚀</a>
    </div>
</body>
</html>
