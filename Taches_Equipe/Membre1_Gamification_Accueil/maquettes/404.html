<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page Introuvable</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .error-code { font-size: 8em; font-weight: bold; margin: 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .btn { padding: 12px 25px; background: rgba(255, 255, 255, 0.1); color: white; text-decoration: none; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); transition: 0.3s; }
        .btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>
    <div>
        <h1 class="error-code">404</h1>
        <p class="message">Oups ! Tu t'es perdu(e) dans les couloirs de l'IFRI ?</p>
        <a href="/dashboard/" class="btn">Retour à la sécurité 🏠</a>
    </div>
</body>
</html>
